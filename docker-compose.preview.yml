services:
  api:
    ports:
      - "3001:3001"

  admin:
    ports:
      - "3000:3000"

  nginx-preview:
    image: nginx:1.27-alpine
    container_name: jss-preview-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/preview.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_prod_data:/var/www/jinshansong/uploads:ro
